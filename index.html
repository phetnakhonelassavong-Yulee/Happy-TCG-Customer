document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ht:800;color:#4A3F63;\">{{ p.costStr }} <span style=\"font-size:12px;color:#00A896;font-weight:900;\">{{ p.marginStr }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"min-width:90px;\">\n              <div style=\"font-size:11px;font-weight:800;color:#6B5E85;\">STOCK<\u002Fdiv>\n              <div style=\"font-weight:900;color:{{ p.stockColor }};\">{{ p.stock }} {{ p.uom }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ p.edit }}\" style=\"border:3px solid #2B2140;border-radius:12px;background:#FFC93C;font-weight:800;cursor:pointer;padding:8px 16px;box-shadow:2px 2px 0 #2B2140;\">Edit<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- STOCK -->\n    <sc-if value=\"{{ tabStock }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Owner – Stock in/out\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start;\">\n      <div style=\"background:#fff;border:3px solid #2B2140;border-radius:20px;box-shadow:4px 4px 0 #2B2140;padding:20px;\">\n        <h2 style=\"font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;font-weight:800;font-size:22px;margin:0 0 14px;\">Record stock movement<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:12px;\">\n          <label style=\"font-weight:800;font-size:13px;\">Product\n            <sc-raw-select name=\"productId\" value=\"{{ stockForm.productId }}\" sc-camel-on-change=\"{{ onStockChange }}\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px;font-weight:700;background:#fff;\">\n              <sc-for list=\"{{ productOptions }}\" as=\"o\" hint-placeholder-count=\"6\">\n                <option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Flabel>\n          <div style=\"display:flex;gap:8px;\">\n            <button sc-camel-on-click=\"{{ setStockIn }}\" style=\"flex:1;border:3px solid #2B2140;border-radius:12px;padding:10px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #2B2140;background:{{ inBtnBg }};color:{{ inBtnFg }};\">Stock IN<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ setStockOut }}\" style=\"flex:1;border:3px solid #2B2140;border-radius:12px;padding:10px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #2B2140;background:{{ outBtnBg }};color:{{ outBtnFg }};\">Stock OUT<\u002Fbutton>\n          <\u002Fdiv>\n          <label style=\"font-weight:800;font-size:13px;\">Quantity\n            <input name=\"qty\" type=\"number\" min=\"1\" value=\"{{ stockForm.qty }}\" sc-camel-on-change=\"{{ onStockChange }}\" placeholder=\"0\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:700;\">\n          <\u002Flabel>\n          <label style=\"font-weight:800;font-size:13px;\">Note\n            <input name=\"note\" value=\"{{ stockForm.note }}\" sc-camel-on-change=\"{{ onStockChange }}\" placeholder=\"e.g. supplier delivery, damaged item…\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:600;\">\n          <\u002Flabel>\n          <button sc-camel-on-click=\"{{ submitStock }}\" style=\"background:#00A896;color:#fff;border:3px solid #2B2140;border-radius:14px;padding:12px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:3px 3px 0 #2B2140;font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;\">Save movement<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:3px solid #2B2140;border-radius:20px;box-shadow:4px 4px 0 #2B2140;padding:20px;\">\n        <h2 style=\"font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;font-weight:800;font-size:22px;margin:0 0 14px;\">History<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:8px;max-height:520px;overflow:auto;\">\n          <sc-for list=\"{{ allMoves }}\" as=\"m\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;gap:10px;align-items:center;border-bottom:2px dashed #E7DCC8;padding-bottom:8px;\">\n              <div style=\"font-weight:900;min-width:44px;text-align:center;border:2px solid #2B2140;border-radius:10px;padding:3px 6px;font-size:13px;background:{{ m.badgeBg }};color:{{ m.badgeFg }};\">{{ m.qtyStr }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:0;\">\n                <div style=\"font-weight:800;font-size:14px;\">{{ m.name }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#6B5E85;font-weight:700;\">{{ m.typeLabel }} · {{ m.when }} · {{ m.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- CATEGORIES & TAGS -->\n    <sc-if value=\"{{ tabCats }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Owner – Categories, Tags &amp; Units\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:20px;align-items:start;max-width:1200px;\">\n      <div>\n        <h1 style=\"font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;font-weight:800;font-size:26px;margin:0 0 16px;\">Categories<\u002Fh1>\n        <div style=\"display:flex;gap:8px;margin-bottom:16px;\">\n          <input value=\"{{ newCat }}\" sc-camel-on-change=\"{{ onNewCat }}\" placeholder=\"New category name\" style=\"flex:1;border:3px solid #2B2140;border-radius:12px;padding:10px 12px;font-weight:700;\">\n          <button sc-camel-on-click=\"{{ addCategory }}\" style=\"background:#FF5C39;color:#fff;border:3px solid #2B2140;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #2B2140;\">Add<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ catRows }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border:3px solid #2B2140;border-radius:14px;box-shadow:2px 2px 0 #2B2140;padding:12px 16px;display:flex;align-items:center;gap:12px;\">\n              <div style=\"flex:1;font-weight:800;\">{{ c.name }}<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:800;color:#6B5E85;\">{{ c.count }} products<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ c.del }}\" style=\"border:3px solid #2B2140;border-radius:10px;background:#fff;color:#D63E1E;font-weight:800;cursor:pointer;padding:5px 10px;font-size:12px;\">Delete<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h1 style=\"font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;font-weight:800;font-size:26px;margin:0 0 16px;\">Product tags<\u002Fh1>\n        <div style=\"display:flex;gap:8px;margin-bottom:16px;\">\n          <input value=\"{{ newTag }}\" sc-camel-on-change=\"{{ onNewTag }}\" placeholder=\"New tag name\" style=\"flex:1;border:3px solid #2B2140;border-radius:12px;padding:10px 12px;font-weight:700;\">\n          <button sc-camel-on-click=\"{{ addTag }}\" style=\"background:#7B61FF;color:#fff;border:3px solid #2B2140;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #2B2140;\">Add<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ tagRows }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <div style=\"background:#fff;border:3px solid #2B2140;border-radius:14px;box-shadow:2px 2px 0 #2B2140;padding:12px 16px;display:flex;align-items:center;gap:12px;\">\n              <div style=\"flex:1;font-weight:800;\">{{ t.name }}<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:800;color:#6B5E85;\">{{ t.count }} products<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ t.del }}\" style=\"border:3px solid #2B2140;border-radius:10px;background:#fff;color:#D63E1E;font-weight:800;cursor:pointer;padding:5px 10px;font-size:12px;\">Delete<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <h1 style=\"font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;font-weight:800;font-size:26px;margin:0 0 16px;\">Units (UOM)<\u002Fh1>\n        <div style=\"display:flex;gap:8px;margin-bottom:16px;\">\n          <input value=\"{{ newUom }}\" sc-camel-on-change=\"{{ onNewUom }}\" placeholder=\"New unit, e.g. booster\" style=\"flex:1;min-width:0;border:3px solid #2B2140;border-radius:12px;padding:10px 12px;font-weight:700;\">\n          <button sc-camel-on-click=\"{{ addUom }}\" style=\"background:#00A896;color:#fff;border:3px solid #2B2140;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #2B2140;\">Add<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ uomRows }}\" as=\"u\" hint-placeholder-count=\"5\">\n            <div style=\"background:#fff;border:3px solid #2B2140;border-radius:14px;box-shadow:2px 2px 0 #2B2140;padding:12px 16px;display:flex;align-items:center;gap:12px;\">\n              <div style=\"flex:1;font-weight:800;\">{{ u.name }}<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:800;color:#6B5E85;\">{{ u.count }} products<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ u.del }}\" style=\"border:3px solid #2B2140;border-radius:10px;background:#fff;color:#D63E1E;font-weight:800;cursor:pointer;padding:5px 10px;font-size:12px;\">Delete<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:12px;font-weight:700;color:#6B5E85;margin-top:10px;\">Units used by a product can't be deleted. The product form picks from this list.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- STORE PROFILE (owner edit) -->\n    <sc-if value=\"{{ tabProfile }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Owner – Store profile\" style=\"max-width:620px;\">\n      <h1 style=\"font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;font-weight:800;font-size:26px;margin:0 0 6px;\">Store profile<\u002Fh1>\n      <div style=\"font-weight:700;color:#6B5E85;margin-bottom:16px;\">Changes save automatically to the shared database and show on the customer \"Our Store\" page.<\u002Fdiv>\n      <div style=\"background:#fff;border:3px solid #2B2140;border-radius:20px;box-shadow:4px 4px 0 #2B2140;padding:20px;display:flex;flex-direction:column;gap:12px;\">\n        <label style=\"font-weight:800;font-size:13px;\">Store name\n          <input name=\"name\" value=\"{{ profile.name }}\" sc-camel-on-change=\"{{ onProfileChange }}\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:700;\">\n        <\u002Flabel>\n        <label style=\"font-weight:800;font-size:13px;\">Tagline\n          <input name=\"tagline\" value=\"{{ profile.tagline }}\" sc-camel-on-change=\"{{ onProfileChange }}\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:700;\">\n        <\u002Flabel>\n        <label style=\"font-weight:800;font-size:13px;\">About\n          <textarea name=\"about\" value=\"{{ profile.about }}\" sc-camel-on-change=\"{{ onProfileChange }}\" rows=\"4\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:600;resize:vertical;\"><\u002Ftextarea>\n        <\u002Flabel>\n        <label style=\"font-weight:800;font-size:13px;\">Address\n          <input name=\"address\" value=\"{{ profile.address }}\" sc-camel-on-change=\"{{ onProfileChange }}\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:700;\">\n        <\u002Flabel>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n          <label style=\"font-weight:800;font-size:13px;flex:1;min-width:160px;\">Phone\n            <input name=\"phone\" value=\"{{ profile.phone }}\" sc-camel-on-change=\"{{ onProfileChange }}\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:700;\">\n          <\u002Flabel>\n          <label style=\"font-weight:800;font-size:13px;flex:1;min-width:160px;\">Opening hours\n            <input name=\"hours\" value=\"{{ profile.hours }}\" sc-camel-on-change=\"{{ onProfileChange }}\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:700;\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"border-top:3px dashed #E7DCC8;padding-top:12px;display:flex;flex-direction:column;gap:16px;\">\n          <div style=\"font-weight:800;font-size:15px;font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;\">Brand images<\u002Fdiv>\n\n          <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;\">\n            <div style=\"width:72px;height:72px;border:3px solid #2B2140;border-radius:14px;position:relative;overflow:hidden;background:#FFC93C;display:flex;align-items:center;justify-content:center;\">\n              <sc-if value=\"{{ hasLogo }}\" hint-placeholder-val=\"{{ false }}\">{{ logoEl }}<\u002Fsc-if>\n              <sc-if value=\"{{ noLogo }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;font-weight:800;font-size:26px;\">H<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:200px;\">\n              <div style=\"font-weight:800;font-size:13px;\">Logo<\u002Fdiv>\n              <div style=\"font-size:12px;font-weight:700;color:#6B5E85;margin-bottom:8px;\">Square, 256 × 256 px (PNG with transparent background works best). Shows next to the store name in the header.<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n                <label style=\"background:#00A896;color:#fff;border:3px solid #2B2140;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #2B2140;display:inline-block;font-size:13px;\">Upload logo\n                  <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onLogoPick }}\" style=\"display:none;\">\n                <\u002Flabel>\n                <sc-if value=\"{{ hasLogo }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ removeLogo }}\" style=\"border:3px solid #2B2140;border-radius:12px;background:#fff;color:#D63E1E;font-weight:800;cursor:pointer;padding:8px 12px;font-size:13px;\">Remove<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-weight:800;font-size:13px;\">Header banner<\u002Fdiv>\n            <div style=\"font-size:12px;font-weight:700;color:#6B5E85;margin-bottom:8px;\">Wide strip, 1600 × 200 px. Shows as the background of the top header bar.<\u002Fdiv>\n            <div style=\"height:72px;border:3px solid #2B2140;border-radius:14px;position:relative;overflow:hidden;background:#FFF6EC;display:flex;align-items:center;justify-content:center;margin-bottom:10px;\">\n              <sc-if value=\"{{ hasBanner }}\" hint-placeholder-val=\"{{ false }}\">{{ bannerEl }}<\u002Fsc-if>\n              <sc-if value=\"{{ noBanner }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-family:monospace;font-size:11px;color:#6B5E85;\">no banner — default header background<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n              <label style=\"background:#00A896;color:#fff;border:3px solid #2B2140;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #2B2140;display:inline-block;font-size:13px;\">Upload banner\n                <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onBannerPick }}\" style=\"display:none;\">\n              <\u002Flabel>\n              <sc-if value=\"{{ hasBanner }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ removeBanner }}\" style=\"border:3px solid #2B2140;border-radius:12px;background:#fff;color:#D63E1E;font-weight:800;cursor:pointer;padding:8px 12px;font-size:13px;\">Remove<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-weight:800;font-size:13px;\">Page background<\u002Fdiv>\n            <div style=\"font-size:12px;font-weight:700;color:#6B5E85;margin-bottom:8px;\">Full screen, 1920 × 1080 px. Shows behind the whole site — soft, light images keep text readable.<\u002Fdiv>\n            <div style=\"height:110px;border:3px solid #2B2140;border-radius:14px;position:relative;overflow:hidden;background:#FFF6EC;display:flex;align-items:center;justify-content:center;margin-bottom:10px;\">\n              <sc-if value=\"{{ hasBg }}\" hint-placeholder-val=\"{{ false }}\">{{ bgPreviewEl }}<\u002Fsc-if>\n              <sc-if value=\"{{ noBg }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-family:monospace;font-size:11px;color:#6B5E85;\">no background — default warm cream<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n              <label style=\"background:#00A896;color:#fff;border:3px solid #2B2140;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #2B2140;display:inline-block;font-size:13px;\">Upload background\n                <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ onBgPick }}\" style=\"display:none;\">\n              <\u002Flabel>\n              <sc-if value=\"{{ hasBg }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ removeBg }}\" style=\"border:3px solid #2B2140;border-radius:12px;background:#fff;color:#D63E1E;font-weight:800;cursor:pointer;padding:8px 12px;font-size:13px;\">Remove<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:3px dashed #E7DCC8;padding-top:12px;display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;font-weight:800;font-size:16px;\">Social channels<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;\">\n            <label style=\"font-weight:800;font-size:13px;\">WhatsApp number (for orders)\n              <input name=\"whatsapp\" value=\"{{ profile.whatsapp }}\" sc-camel-on-change=\"{{ onProfileChange }}\" placeholder=\"e.g. 8562055134192\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:700;\">\n            <\u002Flabel>\n            <label style=\"font-weight:800;font-size:13px;\">Facebook link\n              <input name=\"facebook\" value=\"{{ profile.facebook }}\" sc-camel-on-change=\"{{ onProfileChange }}\" placeholder=\"e.g. facebook.com/happytcg\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:700;\">\n            <\u002Flabel>\n            <label style=\"font-weight:800;font-size:13px;\">TikTok link\n              <input name=\"tiktok\" value=\"{{ profile.tiktok }}\" sc-camel-on-change=\"{{ onProfileChange }}\" placeholder=\"e.g. tiktok.com/@happytcg\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:700;\">\n            <\u002Flabel>\n            <label style=\"font-weight:800;font-size:13px;\">Instagram link\n              <input name=\"instagram\" value=\"{{ profile.instagram }}\" sc-camel-on-change=\"{{ onProfileChange }}\" placeholder=\"e.g. instagram.com/happytcg\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:700;\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:700;color:#6B5E85;\">WhatsApp: country code + number, digits only. Links can be pasted with or without https:// — filled-in channels show as buttons on the customer \"Our Store\" page. The owner password is now your login account — change it in Supabase → Authentication.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ PRODUCT MODAL ============ -->\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div role=\"dialog\" aria-modal=\"true\" aria-label=\"{{ modalTitle }}\" style=\"position:fixed;inset:0;background:rgba(43,33,64,0.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;\">\n    <div style=\"background:#fff;border:3px solid #2B2140;border-radius:22px;box-shadow:6px 6px 0 #2B2140;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto;animation:pop .2s ease;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;\">\n        <h2 style=\"font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;font-weight:800;font-size:22px;margin:0;\">{{ modalTitle }}<\u002Fh2>\n        <button aria-label=\"Close dialog\" sc-camel-on-click=\"{{ closeModal }}\" style=\"border:3px solid #2B2140;border-radius:10px;background:#fff;font-weight:900;cursor:pointer;width:34px;height:34px;font-size:15px;\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <label style=\"font-weight:800;font-size:13px;\">Name\n          <input name=\"name\" value=\"{{ form.name }}\" sc-camel-on-change=\"{{ onFormChange }}\" placeholder=\"     <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;\">\n              <span aria-hidden=\"true\" style=\"width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;border:3px solid #2B2140;border-radius:10px;background:#FFDFD6;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\"><path fill=\"#FF0000\" d=\"M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8z\"><\u002Fpath><path fill=\"#fff\" d=\"M9.6 15.6 15.8 12 9.6 8.4z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <input name=\"linkYoutube\" value=\"{{ form.linkYoutube }}\" sc-camel-on-change=\"{{ onFormChange }}\" placeholder=\"YouTube link\" style=\"flex:1;min-width:0;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font:inherit;font-weight:600;font-size:13px;\">\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;\">\n              <span aria-hidden=\"true\" style=\"width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;border:3px solid #2B2140;border-radius:10px;background:#DCE7FF;\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\"><path fill=\"#1877F2\" d=\"M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.6 4.5-4.6 1.3 0 2.6.2 2.6.2v2.9h-1.5c-1.5 0-1.9.9-1.9 1.8V12h3.3l-.5 3.5h-2.8v8.4A12 12 0 0 0 24 12z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <input name=\"linkFacebook\" value=\"{{ form.linkFacebook }}\" sc-camel-on-change=\"{{ onFormChange }}\" placeholder=\"Facebook link\" style=\"flex:1;min-width:0;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font:inherit;font-weight:600;font-size:13px;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:12px;font-weight:600;color:#6B5E85;\">Leave a box empty to hide it. Filled links show as buttons on the product page.<\u002Fdiv>\n        <\u002Fdiv>\n        <label style=\"font-weight:800;font-size:13px;\">Description\n          <textarea name=\"desc\" value=\"{{ form.desc }}\" sc-camel-on-change=\"{{ onFormChange }}\" rows=\"3\" style=\"margin-top:5px;width:100%;border:3px solid #2B2140;border-radius:12px;padding:9px 12px;font-weight:600;resize:vertical;\"><\u002Ftextarea>\n        <\u002Flabel>\n        <div>\n          <div style=\"font-weight:800;font-size:13px;margin-bottom:2px;\">Product photos ({{ formPhotoCount }})<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:600;color:#6B5E85;margin-bottom:6px;\">Photos are saved square at 1600 × 1600 px. Upload a 1:1 image — anything else is centre-cropped.<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center;\">\n            <sc-for list=\"{{ formPhotoRows }}\" as=\"fp\" hint-placeholder-count=\"2\">\n              <div style=\"width:64px;height:64px;border:3px solid #2B2140;border-radius:12px;position:relative;overflow:hidden;\">\n                {{ fp.el }}\n                <button aria-label=\"Remove photo\" sc-camel-on-click=\"{{ fp.remove }}\" style=\"position:absolute;top:2px;right:2px;width:20px;height:20px;border:2px solid #2B2140;border-radius:8px;background:#fff;color:#D63E1E;font-weight:900;cursor:pointer;font-size:10px;line-height:1;padding:0;\">✕<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <label style=\"background:#00A896;color:#fff;border:3px solid #2B2140;border-radius:12px;padding:9px 16px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 #2B2140;display:inline-block;\">+ Add photos\n              <input type=\"file\" accept=\"image/*\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ onPhotoPick }}\" style=\"display:none;\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:700;color:#6B5E85;margin-top:5px;\">The first photo is the cover. Customers can view all photos on the product page.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-weight:800;font-size:13px;margin-bottom:6px;\">Tile color (used when there is no photo)<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n            <sc-for list=\"{{ colorOptions }}\" as=\"co\" hint-placeholder-count=\"6\">\n              <button aria-label=\"Tile color {{ co.c }}\" sc-camel-on-click=\"{{ co.pick }}\" style=\"width:36px;height:36px;border-radius:12px;cursor:pointer;background:{{ co.c }};border:{{ co.border }};\"><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px;margin-top:6px;\">\n          <button sc-camel-on-click=\"{{ saveProduct }}\" style=\"flex:1;background:#FF5C39;color:#fff;border:3px solid #2B2140;border-radius:14px;padding:12px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:3px 3px 0 #2B2140;font-family:'Baloo 2','Noto Sans Lao Looped',sans-serif;\">{{ saveProductLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ formIsEdit }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ deleteProduct }}\" style=\"border:3px solid #2B2140;border-radius:14px;background:#fff;color:#D63E1E;font-weight:800;cursor:pointer;padding:12px 16px;\">Delete<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TOAST ============ -->\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div role=\"status\" aria-live=\"polite\" style=\"position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;background:#2B2140;color:#fff;border:3px solid #2B2140;border-radius:14px;padding:12px 22px;font-weight:800;box-shadow:4px 4px 0 rgba(43,33,64,0.3);animation:slideup .2s ease;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <footer style=\"border-top:3px solid #2B2140;background:#FFFDF8;padding:16px 20px;text-align:center;font-weight:800;color:#6B5E85;font-size:13px;\">Happy Game Store<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;lowStockThreshold&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 3, &quot;min&quot;: 1, &quot;max&quot;: 50, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Behavior&quot; },\n  &quot;showMargin&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Admin view&quot; }\n}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.SB_URL = 'https://czadgoabnzzpxbonprkl.supabase.co';\n    this.SB_KEY = 'sb_publishable_SE8ODBgZBvcvUNHPpbaPNA_0x9_H0Un';\n    let cart = [];\n    try { cart = JSON.parse(localStorage.getItem('happy-tcg-cart-v2')) || []; } catch (e) {}\n    let remembered = false;\n    try { remembered = localStorage.getItem('happy-tcg-owner-v1') === '1'; } catch (e) {}\n    let cached = null;\n    try { cached = JSON.parse(localStorage.getItem('happy-tcg-catalog-v1')); } catch (e) {}\n    this.state = {\n      loading: !cached,\n      view: 'shop',\n      cur: 'LAK',\n      screen: 'browse',\n      tab: 'dash',\n      searchQ: '', activeCat: 'all', shopTags: [], filtersOpen: false, sortBy: 'featured', loadFailed: false,\n      selId: null, galleryIdx: 0, detailQty: 1,\n      modalOpen: false, saving: false,\n      form: this.blankForm(),\n      stockForm: { productId: '', type: 'in', qty: '', note: '' },\n      newCat: '', newTag: '', newUom: '',\n      ownerCatFilter: 'all', ownerUomFilter: 'all', orderFilter: 'all',\n      ownerAuthed: remembered, loginEmail: '', loginPass: '', loggingIn: false,\n      checkout: { name: '', phone: '', address: '', shipping: '' }, placing: false,\n      toast: '', lastOrderNo: '', lastWaHref: '',\n      products: (cached && cached.products) || [],\n      categories: (cached && cached.categories) || [],\n      tags: (cached && cached.tags) || [],\n      uoms: (cached && cached.uoms) || [],\n      movements: [], orders: [],\n      profile: (cached && cached.profile) || { name: 'Happy Game Store', tagline: '', about: '', address: '', phone: '', whatsapp: '', hours: '', facebook: '', tiktok: '', instagram: '', rateLAK: 605, rateUSD: 36 },\n      cart\n    };\n    this._toastTimer = null;\n    this._profTimer = null;\n  }\n\n  componentDidMount() {\n    try { document.documentElement.lang = 'en'; } catch (e) {}\n    // Preload likely-LCP images from the cached catalog so they start downloading before render\n    try {\n      const st = this.state;\n      const urls = [st.profile.banner, st.profile.background].concat(st.products.slice(0, 4).map(p => p.images && p.images[0]));\n      urls.filter(Boolean).forEach(u => {\n        const l = document.createElement('link');\n        l.rel = 'preload'; l.as = 'image'; l.href = u; l.fetchPriority = 'high';\n        document.head.appendChild(l);\n      });\n    } catch (e) {}\n    this.loadCatalog(); // fires immediately over raw REST — supabase-js is only loaded on demand\n    if (this.state.ownerAuthed) this.restoreSession();\n    try {\n      const pid = new URLSearchParams(location.search).get('p');\n      if (pid) this.setState({ view: 'shop', screen: 'product', selId: pid, galleryIdx: 0, detailQty: 1 });\n    } catch (e) {}\n  }\n\n  productUrl(p) {\n    try {\n      const u = new URL(location.href);\n      u.hash = ''; u.search = '?p=' + encodeURIComponent(p.id);\n      return u.toString();\n    } catch (e) { return location.href; }\n  }\n\n  async shareProduct(p) {\n    const url = this.productUrl(p);\n    const data = { title: p.name, text: p.name + ' — Happy Game Store', url };\n    try {\n      if (navigator.share) { await navigator.share(data); return; }\n    } catch (e) { if (e && e.name === 'AbortError') return; }\n    try { await navigator.clipboard.writeText(url); this.toast('Link copied'); }\n    catch (e) { window.prompt('Copy this link', url); }\n  }\n\n  // Restore a previous sign-in so login is only asked for once per device\n  async restoreSession() {\n    try {\n      const sb = await this.ensureSb();\n      const { data } = await sb.auth.getSession();\n      if (data && data.session) { this.loadOwnerData(); return; }\n    } catch (e) {}\n    try { localStorage.removeItem('happy-tcg-owner-v1'); } catch (e) {}\n    this.setState({ ownerAuthed: false });\n  }\n\n  // Lazy-load supabase-js only when a write/auth operation needs it\n  ensureSb() {\n    if (this.sb) return Promise.resolve(this.sb);\n    if (!this._sbLoad) {\n      this._sbLoad = new Promise((resolve, reject) => {\n        const done = () => { this.sb = window.supabase.createClient(this.SB_URL, this.SB_KEY); resolve(this.sb); };\n        if (window.supabase) { done(); return; }\n        const sc = document.createElement('script');\n        sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';\n        sc.onload = done;\n        sc.onerror = () => { this._sbLoad = null; reject(new Error('connection problem — try again')); };\n        document.head.appendChild(sc);\n      });\n    }\n    return this._sbLoad;\n  }\n\n  // Direct PostgREST fetch — skips the supabase-js client so first paint isn't blocked on the CDN script\n  rest(q) {\n    return fetch(this.SB_URL + '/rest/v1/' + q, { headers: { apikey: this.SB_KEY, Authorization: 'Bearer ' + this.SB_KEY } })\n      .then(r => r.json().then(data => r.ok ? { data, error: null } : { data: null, error: (data && data.message) ? data : { message: 'HTTP ' + r.status } }))\n      .catch(e => ({ data: null, error: { message: e.message || 'network error' } }));\n  }\n\n  pubUrl(bucket, path) {\n    return path ? this.SB_URL + '/storage/v1/object/public/' + b urn out;\n  }\n\n  // Attached links ride along inside the product description, after a marker line,\n  // so no schema change is needed. One URL per line, optional \"Label | url\".\n  splitDesc(raw) {\n    let text = String(raw || '');\n    let discount = 0;\n    text = text.replace(/\\[\\[discount\\]\\]\\s*(\\d{1,2})/, (m, n) => { discount = Math.max(0, Math.min(95, Number(n) || 0)); return ''; });\n    const i = text.indexOf('[[links]]');\n    if (i === -1) return { desc: text.trim(), linkLines: '', discount };\n    return { desc: text.slice(0, i).trim(), linkLines: text.slice(i + 9).trim(), discount };\n  }\n\n  joinDesc(desc, linkLines, discount) {\n    const lines = String(linkLines || '').split('\\n').map(l => l.trim()).filter(Boolean);\n    const pct = Math.max(0, Math.min(95, Math.round(Number(discount) || 0)));\n    let out = String(desc || '').trim();\n    if (pct > 0) out += '\\n[[discount]]' + pct;\n    if (lines.length) out += '\\n[[links]]\\n' + lines.join('\\n');\n    return out.trim();\n  }\n\n  parseLinks(linkLines) {\n    return String(linkLines || '').split('\\n').map(l => l.trim()).filter(Boolean).map(line => {\n      const bar = line.indexOf('|');\n      let label = '', url = line;\n      if (bar > -1) { label = line.slice(0, bar).trim(); url = line.slice(bar + 1).trim(); }\n      if (!/^https?:\\/\\//i.test(url)) url = 'https://' + url.replace(/^\\/+/, '');\n      let kind = 'link', glyph = '↗', bg = '#EDE7FF';\n      if (/tiktok\\.com/i.test(url)) { kind = 'TikTok'; glyph = '♪'; bg = '#E7E1FF'; }\n      else if (/youtube\\.com|youtu\\.be/i.test(url)) { kind = 'YouTube'; glyph = '▶'; bg = '#FFDFD6'; }\n      else if (/facebook\\.com|fb\\.watch/i.test(url)) { kind = 'Facebook'; glyph = 'f'; bg = '#DCE7FF'; }\n      else if (/instagram\\.com/i.test(url)) { kind = 'Instagram'; glyph = '◎'; bg = '#FFE1F0'; }\n      else if (/shopee|lazada/i.test(url)) { kind = 'Shop'; glyph = '◆'; bg = '#FFF0D6'; }\n      let host = url; try { host = new URL(url). ved');\n    } catch (err) {\n      this.toast('Failed: ' + (err.message || err));\n    }\n  }\n\n  persistCart() {\n    try { localStorage.setItem('happy-tcg-cart-v2', JSON.stringify(this.state.cart)); } catch (e) {}\n  }\n\n  toast(msg) {\n    clearTimeout(this._toastTimer);\n    this.setState({ toast: msg });\n    this._toastTimer = setTimeout(() => this.setState({ toast: '' }), 2800);\n  }\n\n  rateLAK() { return this.state.profile.rateLAK || 605; }\n  rateUSD() { return this.state.profile.rateUSD || 36; }\n\n  fmt(thb) {\n    const c = this.state.cur;\n    if (c === 'USD') return '$' + (thb / this.rateUSD()).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n    if (c === 'LAK') return '₭' + Math.round(thb * this.rateLAK()).toLocaleString('en-US');\n    return '฿' + Math.round(thb).toLocaleString('en-US');\n  }\n\n  basePriceFor(p) {\n    const c = this.state.cur;\n    if (c === 'USD') return p.priceUSD > 0 ? p.priceUSD : Math.round(p.price / this.rateUSD() * 100) / 100;\n    if (c === 'LAK') return p.priceLAK > 0 ? p.priceLAK : Math.round(p.price * this.rateLAK());\n    return p.price;\n  }\n\n  priceFor(p) {\n    const pct = Math.max(0, Math.min(95, Number(p.discount) || 0));\n    if (pct > 0) {\n      const v = this.basePriceFor(p) * (1 - pct / 100);\n      return this.state.cur === 'USD' ? Math.round(v * 100) / 100 : Math.round(v);\n    }\n    return this.rawPriceFor(p);\n  }\n\n  rawPriceFor(p) {\n    const c = this.state.cur;\n    if (c === 'USD') return p.priceUSD > 0 ? p.priceUSD : Math.round(p.price / this.rateUSD() * 100) / 100;\n    if (c === 'LAK') return p.priceLAK > 0 ? p.priceLAK : Math.round(p.price * this.rateLAK());\n    return p.price;\n  }\n\n  fmtCur(v) {\n    const c = this.state.cur;\n    if (c === 'USD') return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n    if (c === 'LAK') return '₭' + Math.round(v).toLocaleString('en-US');\n    return '฿' + v.toLocaleString('e
